<div class="container mt-4">
  <div class="row">
    @for (game of games(); track game.id) {
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
          
          <img [src]="game.gameImageURL" class="card-img-top" [alt]="game.name" style="height: 200px; object-fit: cover;">
          
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start">
              <h5 class="card-title">{{ game.name }}</h5>
              <span class="badge bg-primary">{{ game.genre }}</span>
            </div>
            
            <p class="card-text text-muted flex-grow-1">
              {{ game.description }}
            </p>
            
            <div class="d-flex justify-content-between align-items-center mt-3">
              <span class="h5 mb-0">${{ game.price }}</span>
              <div class="btn-group">
                <button class="btn btn-sm btn-outline-secondary">Details</button>
                <button class="btn btn-sm btn-primary">Edit</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <div class="text-center">
        <p>No games found in the catalog.</p>
      </div>
    }
  </div>
</div>
